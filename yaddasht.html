<style>
  :root {
    --paper: #EFE7D6;
    --paper-deep: #E4D9C2;
    --card: #F8F3E7;
    --ink: #2A241C;
    --ink-soft: #6B6152;
    --accent: #1F6F5C;
    --accent-soft: #D8E8E2;
    --folder: #A6672F;
    --folder-soft: #F0DFC9;
    --line: rgba(42,36,28,0.14);
    --danger: #A5402F;
    --shadow: rgba(42,36,28,0.18);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1B1712;
      --paper-deep: #14110D;
      --card: #221D16;
      --ink: #EAE1CF;
      --ink-soft: #A39781;
      --accent: #52C4A0;
      --accent-soft: #22342D;
      --folder: #D69A5E;
      --folder-soft: #332619;
      --line: rgba(234,225,207,0.14);
      --danger: #E08571;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1712;
    --paper-deep: #14110D;
    --card: #221D16;
    --ink: #EAE1CF;
    --ink-soft: #A39781;
    --accent: #52C4A0;
    --accent-soft: #22342D;
    --folder: #D69A5E;
    --folder-soft: #332619;
    --line: rgba(234,225,207,0.14);
    --danger: #E08571;
    --shadow: rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Vazirmatn', sans-serif;
    overscroll-behavior-y: contain;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 560px; margin: 0 auto; position: relative; }

  header {
    flex: 0 0 auto;
    padding: 18px 18px 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
  .theme-btn {
    border: none; background: transparent; color: var(--ink-soft);
    font-size: 18px; padding: 6px; border-radius: 8px; line-height: 1;
  }
  .breadcrumb {
    margin-top: 10px; font-size: 13.5px; color: var(--ink-soft);
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
    min-height: 18px;
  }
  .breadcrumb .crumb { cursor: pointer; }
  .breadcrumb .crumb:hover { color: var(--accent); }
  .breadcrumb .crumb.current { color: var(--ink); font-weight: 500; cursor: default; }
  .breadcrumb .sep { opacity: 0.5; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    border: none; background: var(--card); color: var(--ink);
    font-family: inherit; font-size: 13.5px; padding: 6px 12px 6px 10px;
    border-radius: 20px; margin-bottom: 10px; border: 1px solid var(--line);
  }

  main { flex: 1 1 auto; overflow-y: auto; padding: 10px 14px 120px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 14px; margin-bottom: 8px;
    cursor: pointer; position: relative;
    transition: transform 0.12s ease;
  }
  .row:active { transform: scale(0.985); }
  .row .icon {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .row.folder .icon { background: var(--folder-soft); color: var(--folder); }
  .row.note .icon { background: var(--accent-soft); color: var(--accent); }
  .row .body { flex: 1 1 auto; min-width: 0; }
  .row .name { font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .kebab {
    flex: 0 0 auto; border: none; background: transparent; color: var(--ink-soft);
    font-size: 20px; padding: 6px 4px; border-radius: 8px;
  }

  .empty {
    text-align: center; padding: 70px 20px; color: var(--ink-soft);
  }
  .empty .glyph { font-size: 30px; margin-bottom: 10px; }
  .empty .headline { font-size: 16px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  .empty .sub { font-size: 13.5px; line-height: 1.6; }

  /* FAB */
  .fab-wrap { position: absolute; left: 18px; bottom: 22px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 12px; z-index: 30; }
  .fab-main {
    width: 58px; height: 58px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--paper);
    font-size: 26px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px var(--shadow);
    transition: transform 0.22s cubic-bezier(.4,0,.2,1);
  }
  .fab-main.open { transform: rotate(45deg); }
  .fab-mini {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 26px; padding: 10px 18px 10px 10px;
    box-shadow: 0 4px 12px var(--shadow);
    opacity: 0; transform: translateY(10px) scale(0.9);
    pointer-events: none; transition: all 0.18s ease;
    font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  .fab-mini .mini-ic {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .fab-mini.note .mini-ic { background: var(--accent-soft); color: var(--accent); }
  .fab-mini.folder .mini-ic { background: var(--folder-soft); color: var(--folder); }
  .fab-wrap.open .fab-mini { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .fab-wrap.open .fab-mini[data-d="1"] { transition-delay: 0.03s; }
  .fab-wrap.open .fab-mini[data-d="2"] { transition-delay: 0.07s; }

  .backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.28);
    opacity: 0; pointer-events: none; transition: opacity 0.18s ease; z-index: 20;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  /* Sheets */
  .sheet-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .sheet-backdrop.show { display: flex; }
  .sheet {
    width: 100%; background: var(--paper-deep); border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet h3 { margin: 0 0 14px; font-size: 15.5px; font-weight: 600; }
  .sheet input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-family: inherit; font-size: 15px; margin-bottom: 14px;
  }
  .sheet input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sheet .actions { display: flex; gap: 10px; }
  .sheet button.act {
    flex: 1; padding: 12px; border-radius: 12px; border: none; font-family: inherit;
    font-size: 14.5px; font-weight: 500; cursor: pointer;
  }
  .sheet button.primary { background: var(--accent); color: var(--paper); }
  .sheet button.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .sheet .menu-item {
    display: flex; align-items: center; gap: 12px; padding: 13px 4px;
    font-size: 15px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .sheet .menu-item:last-child { border-bottom: none; }
  .sheet .menu-item.danger { color: var(--danger); }
  .sheet .menu-item .ic { width: 20px; text-align: center; }

  /* Drawer (hamburger menu) */
  .drawer-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.35);
    display: none; z-index: 60;
  }
  .drawer-backdrop.show { display: block; }
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 80%; max-width: 320px;
    background: var(--paper-deep); box-shadow: -8px 0 24px var(--shadow);
    transform: translateX(100%); transition: transform 0.22s ease;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .drawer-backdrop.show .drawer { transform: translateX(0); }
  .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .drawer-header span { font-weight: 700; font-size: 16px; }
  .drawer-header button { border: none; background: transparent; color: var(--ink-soft); font-size: 18px; padding: 4px; }
  .drawer-section-title {
    font-size: 12px; color: var(--ink-soft); margin: 16px 6px 4px; font-weight: 500;
  }
  .drawer-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 6px;
    border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14.5px;
  }
  .drawer-item:last-child { border-bottom: none; }
  .drawer-item .ic {
    width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: var(--accent-soft); color: var(--accent);
  }
  .drawer-item .txt { display: flex; flex-direction: column; gap: 2px; }
  .drawer-item .sub { font-size: 12px; color: var(--ink-soft); }

  /* Editor */
  .editor {
    position: absolute; inset: 0; background: var(--paper);
    display: flex; flex-direction: column; z-index: 40;
    transform: translateX(100%); transition: transform 0.22s ease;
  }
  .editor.show { transform: translateX(0); }
  .editor-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 14px; border-bottom: 1px solid var(--line);
  }
  .editor-bar .side { display: flex; align-items: center; gap: 10px; }
  .editor-bar button {
    border: none; background: transparent; color: var(--ink); font-size: 15px;
    font-family: inherit; padding: 6px 8px; display: flex; align-items: center; gap: 4px;
  }
  .editor-bar .save-hint { font-size: 12px; color: var(--ink-soft); }
  .editor input.note-title {
    border: none; background: transparent; font-family: 'Vazirmatn', sans-serif; font-size: 20px;
    font-weight: 600; color: var(--ink); padding: 14px 18px 4px; width: 100%; flex: 0 0 auto;
  }
  .editor .note-body {
    flex: 1 1 auto; border: none; background: transparent; font-family: 'Vazirmatn', sans-serif;
    font-size: 16px; line-height: 2; color: var(--ink); padding: 6px 18px 32px;
    width: 100%; overflow-y: auto; -webkit-user-select: text; user-select: text;
  }
  .editor .note-body:empty:before {
    content: attr(data-placeholder); color: var(--ink-soft); pointer-events: none;
  }
  .editor input.note-title:focus, .editor .note-body:focus { outline: none; }

  .toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar .tsep { flex: 0 0 auto; width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
  .toolbar button, .toolbar select {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-family: 'Vazirmatn', sans-serif; font-size: 13px; border-radius: 9px;
    height: 34px; min-width: 34px; padding: 0 8px; display: flex; align-items: center; justify-content: center;
  }
  .toolbar button.style-b { font-weight: 700; }
  .toolbar button.style-i { font-style: italic; }
  .toolbar button.style-u { text-decoration: underline; }
  .toolbar button.style-s { text-decoration: line-through; }
  .toolbar button.active { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .toolbar select { padding: 0 6px; max-width: 108px; }
  .align-ic { display: flex; flex-direction: column; gap: 2px; width: 15px; }
  .align-ic span { display: block; height: 2px; border-radius: 1px; background: currentColor; }
  .align-r span:nth-child(1){width:100%} .align-r span:nth-child(2){width:65%;align-self:flex-end} .align-r span:nth-child(3){width:85%;align-self:flex-end}
  .align-c span:nth-child(1){width:100%} .align-c span:nth-child(2){width:65%;align-self:center} .align-c span:nth-child(3){width:85%;align-self:center}
  .align-l span:nth-child(1){width:100%} .align-l span:nth-child(2){width:65%} .align-l span:nth-child(3){width:85%}
  .align-j span{width:100%}

  .swatch-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 16px; }
  .swatch { width: 100%; aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line); cursor: pointer; }
  .swatch.selected { border-color: var(--ink); }
  .custom-color-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .custom-color-row input[type=color] { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; }
  .custom-color-row span { font-size: 13.5px; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title-row">
      <h1>یادداشت</h1>
      <button class="theme-btn" id="hamburgerBtn" aria-label="منو">☰</button>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
  </header>

  <main id="main"></main>

  <div class="backdrop" id="backdrop"></div>
  <div class="fab-wrap" id="fabWrap">
    <button class="fab-main" id="fabMain" aria-label="افزودن">+</button>
    <div class="fab-mini note" id="fabNote" data-d="1"><span class="mini-ic">📝</span><span>یادداشت جدید</span></div>
    <div class="fab-mini folder" id="fabFolder" data-d="2"><span class="mini-ic">📁</span><span>پوشه جدید</span></div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop">
    <div class="drawer" id="drawer">
      <div class="drawer-header">
        <span>منو</span>
        <button id="drawerClose" aria-label="بستن">✕</button>
      </div>

      <div class="drawer-section-title">داده‌ها</div>
      <div class="drawer-item" id="menuBackup">
        <span class="ic">⬇</span>
        <span class="txt"><span>پشتیبان‌گیری</span><span class="sub">خروجی گرفتن از همه‌ی یادداشت‌ها و پوشه‌ها</span></span>
      </div>
      <div class="drawer-item" id="menuRestore">
        <span class="ic">⬆</span>
        <span class="txt"><span>بازیابی از پشتیبان</span><span class="sub">وارد کردن فایل پشتیبان قبلی</span></span>
      </div>

      <div class="drawer-section-title">تنظیمات</div>
      <div class="drawer-item" id="menuTheme">
        <span class="ic">◐</span>
        <span class="txt"><span>تغییر پوسته</span><span class="sub" id="themeSub">روشن / تاریک / سیستم</span></span>
      </div>
      <div class="drawer-item" id="menuInstall" style="display:none;">
        <span class="ic">📲</span>
        <span class="txt"><span>نصب اپ روی گوشی</span><span class="sub">اجرا مثل یه اپ مستقل</span></span>
      </div>
    </div>
  </div>
  <input type="file" id="restoreFileInput" accept="application/json,.json" style="display:none;">

  <div class="editor" id="editor">
    <div class="editor-bar">
      <div class="side">
        <button id="editorBack">‹ بازگشت</button>
      </div>
      <span class="save-hint" id="saveHint">ذخیره شد</span>
    </div>
    <input class="note-title" id="noteTitleInput" placeholder="بدون عنوان" />

    <div class="toolbar">
      <select id="fontSelect" title="فونت">
        <option value="Vazirmatn">وزیرمتن</option>
        <option value="'Noto Naskh Arabic'">نسخ</option>
        <option value="Amiri">امیری</option>
        <option value="Lalezar">لاله‌زار</option>
        <option value="'Markazi Text'">مرکزی</option>
      </select>
      <select id="sizeSelect" title="اندازه">
        <option value="2">ریز</option>
        <option value="3" selected>معمولی</option>
        <option value="5">درشت</option>
        <option value="7">خیلی درشت</option>
      </select>
      <select id="blockSelect" title="سبک پاراگراف">
        <option value="P">پاراگراف</option>
        <option value="H2">تیتر ۱</option>
        <option value="H3">تیتر ۲</option>
        <option value="BLOCKQUOTE">نقل‌قول</option>
      </select>
      <span class="tsep"></span>
      <button id="btnBold" class="style-b" data-cmd="bold" title="بولد">B</button>
      <button id="btnItalic" class="style-i" data-cmd="italic" title="ایتالیک">I</button>
      <button id="btnUnderline" class="style-u" data-cmd="underline" title="زیرخط">U</button>
      <button id="btnStrike" class="style-s" data-cmd="strikeThrough" title="خط‌خورده">S</button>
      <span class="tsep"></span>
      <button id="alignRight" data-align="right" title="راست‌چین"><span class="align-ic align-r"><span></span><span></span><span></span></span></button>
      <button id="alignCenter" data-align="center" title="وسط‌چین"><span class="align-ic align-c"><span></span><span></span><span></span></span></button>
      <button id="alignLeft" data-align="left" title="چپ‌چین"><span class="align-ic align-l"><span></span><span></span><span></span></span></button>
      <button id="alignJustify" data-align="justify" title="تراز از دو طرف"><span class="align-ic align-j"><span></span><span></span><span></span></span></button>
      <span class="tsep"></span>
      <button id="btnUL" data-cmd="insertUnorderedList" title="فهرست نقطه‌ای">•</button>
      <button id="btnOL" data-cmd="insertOrderedList" title="فهرست شماره‌دار">۱.</button>
      <span class="tsep"></span>
      <button id="btnColor" title="رنگ متن">رنگ A</button>
      <button id="btnHighlight" title="هایلایت">هایلایت</button>
      <span class="tsep"></span>
      <button id="btnClear" title="پاک‌کردن قالب‌بندی">پاک‌کردن</button>
      <button id="btnUndo" title="واگرد">↺</button>
      <button id="btnRedo" title="ازنو">↻</button>
    </div>

    <div class="note-body" id="noteBodyDiv" contenteditable="true" data-placeholder="بنویس..."></div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'yaddasht_data_v1';
  var THEME_KEY = 'yaddasht_theme_v1';

  function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function loadData(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return { items: {}, rootOrder: [] };
  }
  function saveData(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  }

  var data = loadData();
  var currentFolderId = null;
  var fabOpen = false;
  var editingNoteId = null;
  var saveTimer = null;

  function childrenOf(folderId){
    var arr = [];
    for (var id in data.items){
      if (data.items[id].parentId === folderId) arr.push(data.items[id]);
    }
    arr.sort(function(a,b){
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return (b.updatedAt||0) - (a.updatedAt||0);
    });
    return arr;
  }

  function pathTo(folderId){
    var chain = [];
    var cur = folderId;
    while (cur){
      var it = data.items[cur];
      if (!it) break;
      chain.unshift(it);
      cur = it.parentId;
    }
    return chain;
  }

  function renderBreadcrumb(){
    var el = document.getElementById('breadcrumb');
    el.innerHTML = '';
    var chain = pathTo(currentFolderId);
    var home = document.createElement('span');
    home.className = 'crumb' + (chain.length === 0 ? ' current' : '');
    home.textContent = 'خانه';
    home.onclick = function(){ currentFolderId = null; render(); };
    el.appendChild(home);
    chain.forEach(function(it, i){
      var sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '‹';
      el.appendChild(sep);
      var c = document.createElement('span');
      c.className = 'crumb' + (i === chain.length-1 ? ' current' : '');
      c.textContent = it.name;
      c.onclick = function(){ currentFolderId = it.id; render(); };
      el.appendChild(c);
    });
  }

  var stripEl = document.createElement('div');
  function plainTextOf(html){
    stripEl.innerHTML = html || '';
    return (stripEl.textContent || '').replace(/\s+/g,' ').trim();
  }

  function fmtDate(ts){
    if (!ts) return '';
    var d = new Date(ts);
    return d.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });
  }

  function renderMain(){
    var main = document.getElementById('main');
    main.innerHTML = '';
    var items = childrenOf(currentFolderId);

    if (currentFolderId !== null){
      var back = document.createElement('button');
      back.className = 'back-btn';
      back.innerHTML = '‹ بازگشت';
      back.onclick = function(){
        var self = data.items[currentFolderId];
        currentFolderId = self ? self.parentId : null;
        render();
      };
      main.appendChild(back);
    }

    if (items.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<div class="glyph">🗂️</div><div class="headline">این پوشه خالیه</div><div class="sub">با دکمه‌ی + پایین صفحه<br>یه یادداشت یا پوشه بساز.</div>';
      main.appendChild(empty);
      return;
    }

    items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'row ' + it.type;
      var iconTxt = it.type === 'folder' ? '📁' : '📝';
      var metaTxt = it.type === 'folder'
        ? (childrenOf(it.id).length + ' مورد')
        : (plainTextOf(it.content).slice(0,40) || 'بدون متن') + (it.updatedAt ? ' · ' + fmtDate(it.updatedAt) : '');
      row.innerHTML =
        '<div class="icon">' + iconTxt + '</div>' +
        '<div class="body"><div class="name"></div><div class="meta"></div></div>' +
        '<button class="kebab" aria-label="گزینه‌ها">⋮</button>';
      row.querySelector('.name').textContent = it.name;
      row.querySelector('.meta').textContent = metaTxt;
      row.onclick = function(ev){
        if (ev.target.closest('.kebab')) return;
        if (it.type === 'folder'){ currentFolderId = it.id; render(); }
        else openNoteEditor(it.id);
      };
      row.querySelector('.kebab').onclick = function(ev){
        ev.stopPropagation();
        openItemMenu(it);
      };
      main.appendChild(row);
    });
  }

  function render(){
    renderBreadcrumb();
    renderMain();
    closeFab();
  }

  // ---- FAB ----
  var fabWrap = document.getElementById('fabWrap');
  var fabMain = document.getElementById('fabMain');
  var backdrop = document.getElementById('backdrop');

  function openFab(){ fabOpen = true; fabWrap.classList.add('open'); fabMain.classList.add('open'); backdrop.classList.add('open'); }
  function closeFab(){ fabOpen = false; fabWrap.classList.remove('open'); fabMain.classList.remove('open'); backdrop.classList.remove('open'); }
  fabMain.onclick = function(){ fabOpen ? closeFab() : openFab(); };
  backdrop.onclick = closeFab;

  document.getElementById('fabNote').onclick = function(){
    closeFab();
    createNote();
  };
  document.getElementById('fabFolder').onclick = function(){
    closeFab();
    openNameSheet('پوشه جدید', 'اسم پوشه', function(name){
      var id = uid();
      data.items[id] = { id: id, type: 'folder', name: name, parentId: currentFolderId, updatedAt: Date.now() };
      saveData();
      render();
    });
  };

  // ---- Name sheet (create / rename) ----
  var sheetBackdrop = document.getElementById('sheetBackdrop');
  var sheetEl = document.getElementById('sheet');

  function closeSheet(){ sheetBackdrop.classList.remove('show'); sheetEl.innerHTML = ''; }
  sheetBackdrop.onclick = function(ev){ if (ev.target === sheetBackdrop) closeSheet(); };

  function openNameSheet(title, placeholder, onSave, initialValue){
    sheetEl.innerHTML =
      '<h3></h3>' +
      '<input type="text" id="sheetInput" placeholder="' + placeholder + '" />' +
      '<div class="actions">' +
        '<button class="act ghost" id="sheetCancel">انصراف</button>' +
        '<button class="act primary" id="sheetSave">ذخیره</button>' +
      '</div>';
    sheetEl.querySelector('h3').textContent = title;
    var input = document.getElementById('sheetInput');
    input.value = initialValue || '';
    sheetBackdrop.classList.add('show');
    setTimeout(function(){ input.focus(); }, 150);
    document.getElementById('sheetCancel').onclick = closeSheet;
    document.getElementById('sheetSave').onclick = function(){
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      closeSheet();
      onSave(v);
    };
    input.onkeydown = function(ev){ if (ev.key === 'Enter') document.getElementById('sheetSave').click(); };
  }

  // ---- Item menu (rename / delete) ----
  function openItemMenu(it){
    sheetEl.innerHTML =
      '<h3></h3>' +
      '<div class="menu-item" id="menuRename"><span class="ic">✏️</span><span>تغییر نام</span></div>' +
      '<div class="menu-item danger" id="menuDelete"><span class="ic">🗑️</span><span></span></div>';
    sheetEl.querySelector('h3').textContent = it.name;
    sheetEl.querySelector('#menuDelete span:last-child').textContent =
      it.type === 'folder' ? 'حذف پوشه و همه‌ی محتوای آن' : 'حذف یادداشت';
    sheetBackdrop.classList.add('show');
    document.getElementById('menuRename').onclick = function(){
      closeSheet();
      openNameSheet(it.type === 'folder' ? 'تغییر نام پوشه' : 'تغییر نام یادداشت', 'اسم', function(name){
        it.name = name;
        it.updatedAt = Date.now();
        saveData();
        render();
      }, it.name);
    };
    document.getElementById('menuDelete').onclick = function(){
      closeSheet();
      confirmDelete(it);
    };
  }

  function confirmDelete(it){
    sheetEl.innerHTML =
      '<h3></h3>' +
      '<div style="font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.7;"></div>' +
      '<div class="actions">' +
        '<button class="act ghost" id="delCancel">انصراف</button>' +
        '<button class="act primary" id="delConfirm" style="background:var(--danger);">حذف</button>' +
      '</div>';
    sheetEl.querySelector('h3').textContent = 'حذف «' + it.name + '»؟';
    sheetEl.querySelector('div[style]').textContent =
      it.type === 'folder' ? 'این پوشه و همه‌ی پوشه‌ها و یادداشت‌های داخلش برای همیشه پاک می‌شن.' : 'این یادداشت برای همیشه پاک می‌شه.';
    sheetBackdrop.classList.add('show');
    document.getElementById('delCancel').onclick = closeSheet;
    document.getElementById('delConfirm').onclick = function(){
      closeSheet();
      deleteItemDeep(it.id);
      saveData();
      render();
    };
  }

  function deleteItemDeep(id){
    var kids = childrenOf(id);
    kids.forEach(function(k){ deleteItemDeep(k.id); });
    delete data.items[id];
  }

  // ---- Note editor (rich text) ----
  var editorEl = document.getElementById('editor');
  var titleInput = document.getElementById('noteTitleInput');
  var bodyDiv = document.getElementById('noteBodyDiv');
  var saveHint = document.getElementById('saveHint');

  try { document.execCommand('styleWithCSS', false, true); } catch(e){}

  function createNote(){
    var id = uid();
    data.items[id] = { id: id, type: 'note', name: '', content: '', parentId: currentFolderId, updatedAt: Date.now() };
    saveData();
    render();
    openNoteEditor(id, true);
  }

  function openNoteEditor(id, focusTitle){
    editingNoteId = id;
    var it = data.items[id];
    titleInput.value = it.name || '';
    bodyDiv.innerHTML = it.content || '';
    saveHint.style.opacity = '0';
    editorEl.classList.add('show');
    setTimeout(function(){ (focusTitle ? titleInput : bodyDiv).focus(); refreshToolbarState(); }, 200);
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      if (!editingNoteId) return;
      var it = data.items[editingNoteId];
      if (!it) return;
      it.name = titleInput.value.trim();
      it.content = bodyDiv.innerHTML;
      it.updatedAt = Date.now();
      saveData();
      saveHint.style.opacity = '1';
      setTimeout(function(){ saveHint.style.opacity = '0'; }, 1200);
    }, 350);
  }
  titleInput.addEventListener('input', scheduleSave);
  bodyDiv.addEventListener('input', scheduleSave);

  document.getElementById('editorBack').onclick = function(){
    clearTimeout(saveTimer);
    var it = data.items[editingNoteId];
    if (it){
      it.name = titleInput.value.trim();
      it.content = bodyDiv.innerHTML;
      it.updatedAt = Date.now();
      if (!it.name && !plainTextOf(it.content)){
        delete data.items[editingNoteId];
      }
      saveData();
    }
    editorEl.classList.remove('show');
    editingNoteId = null;
    render();
  };

  // Toolbar: bold / italic / underline / strike
  ['btnBold','btnItalic','btnUnderline','btnStrike'].forEach(function(id){
    var btn = document.getElementById(id);
    btn.onmousedown = function(ev){ ev.preventDefault(); };
    btn.onclick = function(){
      document.execCommand(btn.getAttribute('data-cmd'), false, null);
      bodyDiv.focus();
      scheduleSave();
      refreshToolbarState();
    };
  });

  // Alignment
  ['alignRight','alignCenter','alignLeft','alignJustify'].forEach(function(id){
    var btn = document.getElementById(id);
    btn.onmousedown = function(ev){ ev.preventDefault(); };
    btn.onclick = function(){
      var map = { right: 'justifyRight', center: 'justifyCenter', left: 'justifyLeft', justify: 'justifyFull' };
      document.execCommand(map[btn.getAttribute('data-align')], false, null);
      bodyDiv.focus();
      scheduleSave();
      refreshToolbarState();
    };
  });

  // Lists
  ['btnUL','btnOL'].forEach(function(id){
    var btn = document.getElementById(id);
    btn.onmousedown = function(ev){ ev.preventDefault(); };
    btn.onclick = function(){
      document.execCommand(btn.getAttribute('data-cmd'), false, null);
      bodyDiv.focus();
      scheduleSave();
      refreshToolbarState();
    };
  });

  // Font family
  var fontSelect = document.getElementById('fontSelect');
  fontSelect.onmousedown = function(ev){ ev.stopPropagation(); };
  fontSelect.onchange = function(){
    document.execCommand('fontName', false, fontSelect.value);
    bodyDiv.focus();
    scheduleSave();
  };

  // Font size (legacy 1-7 scale, applied as CSS via styleWithCSS)
  var sizeSelect = document.getElementById('sizeSelect');
  sizeSelect.onmousedown = function(ev){ ev.stopPropagation(); };
  sizeSelect.onchange = function(){
    document.execCommand('fontSize', false, sizeSelect.value);
    bodyDiv.focus();
    scheduleSave();
  };

  // Paragraph / heading style
  var blockSelect = document.getElementById('blockSelect');
  blockSelect.onmousedown = function(ev){ ev.stopPropagation(); };
  blockSelect.onchange = function(){
    document.execCommand('formatBlock', false, blockSelect.value);
    bodyDiv.focus();
    scheduleSave();
  };

  // Clear formatting
  document.getElementById('btnClear').onmousedown = function(ev){ ev.preventDefault(); };
  document.getElementById('btnClear').onclick = function(){
    document.execCommand('removeFormat', false, null);
    document.execCommand('formatBlock', false, 'P');
    bodyDiv.focus();
    scheduleSave();
    refreshToolbarState();
  };

  // Undo / redo
  document.getElementById('btnUndo').onmousedown = function(ev){ ev.preventDefault(); };
  document.getElementById('btnUndo').onclick = function(){ document.execCommand('undo', false, null); bodyDiv.focus(); scheduleSave(); };
  document.getElementById('btnRedo').onmousedown = function(ev){ ev.preventDefault(); };
  document.getElementById('btnRedo').onclick = function(){ document.execCommand('redo', false, null); bodyDiv.focus(); scheduleSave(); };

  // Text color / highlight — open a swatch sheet
  var TEXT_COLORS = ['#2A241C','#A5402F','#1F6F5C','#1D5FA8','#8A4FB0','#A6672F','#C7893E','#EAE1CF'];
  var HILITE_COLORS = ['transparent','#FCE9A6','#BFE6CF','#CFE0F5','#F3CFE0','#EAD7F5','#F5DCC0'];

  var savedRange = null;
  bodyDiv.addEventListener('mouseup', storeSelection);
  bodyDiv.addEventListener('keyup', storeSelection);
  bodyDiv.addEventListener('touchend', storeSelection);
  function storeSelection(){
    var sel = window.getSelection();
    if (sel && sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
    refreshToolbarState();
  }
  function restoreSelection(){
    if (!savedRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  function openColorSheet(kind){
    var colors = kind === 'text' ? TEXT_COLORS : HILITE_COLORS;
    var title = kind === 'text' ? 'رنگ متن' : 'رنگ هایلایت';
    var html = '<h3></h3><div class="swatch-grid" id="swatchGrid"></div>';
    if (kind === 'hilite'){
      html = '<h3></h3><div class="swatch-grid" id="swatchGrid"></div>';
    }
    html += '<div class="custom-color-row"><input type="color" id="customColorInput" value="' + (kind === 'text' ? '#2A241C' : '#FCE9A6') + '"><span>رنگ دلخواه</span></div>';
    sheetEl.innerHTML = html;
    sheetEl.querySelector('h3').textContent = title;
    var grid = document.getElementById('swatchGrid');
    colors.forEach(function(c){
      var sw = document.createElement('button');
      sw.className = 'swatch';
      sw.style.background = c === 'transparent' ? 'var(--card)' : c;
      sw.style.backgroundImage = c === 'transparent' ? 'linear-gradient(45deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%)' : 'none';
      sw.onclick = function(){
        applyColor(kind, c);
        closeSheet();
      };
      grid.appendChild(sw);
    });
    document.getElementById('customColorInput').oninput = function(ev){
      applyColor(kind, ev.target.value);
    };
    document.getElementById('customColorInput').onchange = function(){ closeSheet(); };
    sheetBackdrop.classList.add('show');
  }

  function applyColor(kind, color){
    restoreSelection();
    bodyDiv.focus();
    if (kind === 'text') document.execCommand('foreColor', false, color);
    else document.execCommand('hiliteColor', false, color === 'transparent' ? 'transparent' : color);
    storeSelection();
    scheduleSave();
  }

  document.getElementById('btnColor').onmousedown = function(ev){ ev.preventDefault(); };
  document.getElementById('btnColor').onclick = function(){ storeSelection(); openColorSheet('text'); };
  document.getElementById('btnHighlight').onmousedown = function(ev){ ev.preventDefault(); };
  document.getElementById('btnHighlight').onclick = function(){ storeSelection(); openColorSheet('hilite'); };

  function refreshToolbarState(){
    try {
      setActive('btnBold', document.queryCommandState('bold'));
      setActive('btnItalic', document.queryCommandState('italic'));
      setActive('btnUnderline', document.queryCommandState('underline'));
      setActive('btnStrike', document.queryCommandState('strikeThrough'));
      setActive('btnUL', document.queryCommandState('insertUnorderedList'));
      setActive('btnOL', document.queryCommandState('insertOrderedList'));
      setActive('alignRight', document.queryCommandState('justifyRight'));
      setActive('alignCenter', document.queryCommandState('justifyCenter'));
      setActive('alignLeft', document.queryCommandState('justifyLeft'));
      setActive('alignJustify', document.queryCommandState('justifyFull'));
    } catch(e){}
  }
  function setActive(id, on){
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('active', !!on);
  }

  // ---- Hamburger drawer ----
  var hamburgerBtn = document.getElementById('hamburgerBtn');
  var drawerBackdrop = document.getElementById('drawerBackdrop');
  function openDrawer(){ drawerBackdrop.classList.add('show'); }
  function closeDrawer(){ drawerBackdrop.classList.remove('show'); }
  hamburgerBtn.onclick = openDrawer;
  document.getElementById('drawerClose').onclick = closeDrawer;
  drawerBackdrop.onclick = function(ev){ if (ev.target === drawerBackdrop) closeDrawer(); };

  // ---- Theme ----
  function applyTheme(t){
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(savedTheme);
  document.getElementById('menuTheme').onclick = function(){
    var order = [null, 'light', 'dark'];
    var cur = document.documentElement.getAttribute('data-theme') || null;
    var idx = order.indexOf(cur);
    var next = order[(idx + 1) % order.length];
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next || ''); } catch(e){}
  };

  // ---- Install (PWA) ----
  var menuInstall = document.getElementById('menuInstall');
  var deferredPrompt = null;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  if (!isStandalone){
    if (isIOS){
      menuInstall.style.display = 'flex';
      menuInstall.onclick = function(){
        closeDrawer();
        sheetEl.innerHTML =
          '<h3>نصب روی گوشی</h3>' +
          '<div style="font-size:13.5px;color:var(--ink-soft);line-height:2;">' +
          'از پایین صفحه‌ی سافاری دکمه‌ی اشتراک‌گذاری (□↑) رو بزن،' +
          ' بعد «Add to Home Screen» رو انتخاب کن.</div>' +
          '<div class="actions" style="margin-top:16px;"><button class="act primary" id="tipOk">متوجه شدم</button></div>';
        sheetBackdrop.classList.add('show');
        document.getElementById('tipOk').onclick = closeSheet;
      };
    }
    window.addEventListener('beforeinstallprompt', function(ev){
      ev.preventDefault();
      deferredPrompt = ev;
      menuInstall.style.display = 'flex';
    });
    if (!isIOS){
      menuInstall.onclick = function(){
        closeDrawer();
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function(){
          deferredPrompt = null;
          menuInstall.style.display = 'none';
        });
      };
    }
    window.addEventListener('appinstalled', function(){
      menuInstall.style.display = 'none';
    });
  }

  // ---- Backup / Restore ----
  function toast(msg){
    saveHint.textContent = msg;
    saveHint.style.opacity = '1';
    setTimeout(function(){ saveHint.style.opacity = '0'; setTimeout(function(){ saveHint.textContent = 'ذخیره شد'; }, 300); }, 1800);
  }

  async function exportBackup(){
    var payload = JSON.stringify({ app: 'yaddasht', version: 1, exportedAt: Date.now(), data: data }, null, 2);
    var filename = 'yaddasht-backup-' + new Date().toISOString().slice(0,10) + '.json';

    try {
      var dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
      if (dl){
        await dl.save({ filename: filename, data: payload });
        closeDrawer();
        return;
      }
    } catch(e){
      if (e && e.code === 'declined') return;
      // otherwise fall through to the classic-download fallback below
    }

    try {
      var blob = new Blob([payload], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      closeDrawer();
    } catch(e2){
      closeDrawer();
      sheetEl.innerHTML = '<h3>ذخیره ممکن نشد</h3><div style="font-size:13.5px;color:var(--ink-soft);">مرورگرت اجازه‌ی ذخیره‌ی فایل رو نداد.</div><div class="actions" style="margin-top:16px;"><button class="act primary" id="okErr">باشه</button></div>';
      sheetBackdrop.classList.add('show');
      document.getElementById('okErr').onclick = closeSheet;
    }
  }
  document.getElementById('menuBackup').onclick = exportBackup;

  var restoreFileInput = document.getElementById('restoreFileInput');
  document.getElementById('menuRestore').onclick = function(){
    closeDrawer();
    restoreFileInput.value = '';
    restoreFileInput.click();
  };
  restoreFileInput.onchange = function(){
    var file = restoreFileInput.files && restoreFileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try { parsed = JSON.parse(reader.result); } catch(e){ parsed = null; }
      var incoming = parsed && parsed.items ? parsed : (parsed && parsed.data && parsed.data.items ? parsed.data : null);
      if (!incoming || typeof incoming.items !== 'object'){
        sheetEl.innerHTML = '<h3>فایل نامعتبره</h3><div style="font-size:13.5px;color:var(--ink-soft);">این فایل، فایل پشتیبان یادداشت نیست.</div><div class="actions" style="margin-top:16px;"><button class="act primary" id="okErr2">باشه</button></div>';
        sheetBackdrop.classList.add('show');
        document.getElementById('okErr2').onclick = closeSheet;
        return;
      }
      var count = Object.keys(incoming.items).length;
      sheetEl.innerHTML =
        '<h3>بازیابی از پشتیبان</h3>' +
        '<div style="font-size:13.5px;color:var(--ink-soft);line-height:1.9;margin-bottom:16px;">' +
        'این فایل شامل ' + count + ' مورد (پوشه/یادداشت) هست. با ادامه، تمام یادداشت‌ها و پوشه‌های فعلیت با این فایل جایگزین می‌شن و قابل بازگشت نیست.</div>' +
        '<div class="actions">' +
          '<button class="act ghost" id="restoreCancel">انصراف</button>' +
          '<button class="act primary" id="restoreConfirm" style="background:var(--danger);">جایگزینی</button>' +
        '</div>';
      sheetBackdrop.classList.add('show');
      document.getElementById('restoreCancel').onclick = closeSheet;
      document.getElementById('restoreConfirm').onclick = function(){
        data = { items: incoming.items, rootOrder: incoming.rootOrder || [] };
        saveData();
        currentFolderId = null;
        closeSheet();
        render();
      };
    };
    reader.readAsText(file, 'utf-8');
  };

  render();
})();
</script>
</body>
</html>
